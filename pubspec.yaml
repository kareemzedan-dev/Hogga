name: hogga
description: "Hogga legal services app."
publish_to: 'none'

version: 1.0.0+13

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.0.0
  equatable: ^2.0.7
  get_it: ^8.0.3
  dartz: ^0.10.1
  intl: ^0.20.2
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^2.0.1
  carousel_slider: ^5.1.1
  geolocator: ^14.0.2
  flutter_localization: ^0.3.3
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.12.0
  internet_connection_checker: ^3.0.1
  shared_preferences: ^2.5.4
  firebase_core: ^3.10.1
  firebase_messaging: ^15.2.1
  dio: ^5.7.0
  geocoding: ^4.0.0
  table_calendar: ^3.1.2
  flutter_svg: ^2.2.4
  google_maps_flutter: ^2.5.0
  url_launcher: ^6.1.14
  flutter_screenutil: ^5.9.3
  package_info_plus: ^9.0.0
  flutter_rating_bar: ^4.0.1
  image_picker: ^1.2.1
  video_player: ^2.10.1
  flutter_map: 7.0.2
  latlong2: 0.9.1
  shimmer: ^3.0.0
  webview_flutter: ^4.13.1
  flutter_local_notifications: ^20.0.0
  fl_chart: ^1.1.1
  file_picker: ^10.1.9
  flutter_secure_storage: ^10.0.0
  flutter_image_compress: ^2.4.0
  pinput: ^6.0.2
  percent_indicator: ^4.2.3
  agora_rtc_engine: ^6.5.4
  permission_handler: ^12.0.1
  socket_io_client: ^3.1.4
  laravel_echo: ^1.0.0-beta.1
  pusher_client: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  rename: ^3.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/locations/egypt_locations.json
    - assets/images/
    - assets/icon/

  fonts:
     - family: Rubik
       fonts:
         - asset: assets/fonts/Rubik-Light.ttf
           weight: 300
         - asset: assets/fonts/Rubik-Regular.ttf
           weight: 400
         - asset: assets/fonts/Rubik-Medium.ttf
           weight: 500
         - asset: assets/fonts/Rubik-SemiBold.ttf
           weight: 600
         - asset: assets/fonts/Rubik-Bold.ttf
           weight: 700
         - asset: assets/fonts/Rubik-ExtraBold.ttf
           weight: 800
         - asset: assets/fonts/Rubik-Black.ttf
           weight: 900
         - asset: assets/fonts/Rubik-LightItalic.ttf
           weight: 300
           style: italic
         - asset: assets/fonts/Rubik-Italic.ttf
           weight: 400
           style: italic
         - asset: assets/fonts/Rubik-MediumItalic.ttf
           weight: 500
           style: italic
         - asset: assets/fonts/Rubik-SemiBoldItalic.ttf
           weight: 600
           style: italic
         - asset: assets/fonts/Rubik-BoldItalic.ttf
           weight: 700
           style: italic
         - asset: assets/fonts/Rubik-ExtraBoldItalic.ttf
           weight: 800
           style: italic
         - asset: assets/fonts/Rubik-BlackItalic.ttf
           weight: 900
           style: italic

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
